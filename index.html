<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAT Quest</title>
<meta name="theme-color" content="#1b0b3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg1:#1b0b3a; --bg2:#0b2b3d; --card:rgba(255,255,255,.08); --line:rgba(255,255,255,.16);
  --text:#f5f3ff; --muted:#b9b2d6; --pink:#ff4fd8; --cyan:#33e1ff; --lime:#b6ff4a;
  --gold:#ffd23f; --red:#ff5d6c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text);
  background:radial-gradient(circle at 20% 0%,#3b1466 0%,transparent 50%),
             radial-gradient(circle at 90% 100%,#0e4a5c 0%,transparent 45%),
             linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  min-height:100vh;
}
.app{max-width:520px;margin:0 auto;padding:16px 16px 90px}
.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;color:var(--text);cursor:pointer;font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn{appearance:none;border:0;border-radius:16px;padding:15px 18px;font-weight:800;font-size:16px;color:#1b0b3a;background:var(--lime);box-shadow:0 5px 0 #7fbf1f;cursor:pointer;width:100%;font-family:inherit;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #7fbf1f}
.btn.alt{background:var(--cyan);box-shadow:0 5px 0 #1d9bb8}
.btn.ghost{background:transparent;color:var(--text);box-shadow:none;border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hero{text-align:center}
.fox{font-size:76px;animation:bob 2.2s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-10px) rotate(-5deg)}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.title{font-size:44px;font-weight:900;line-height:1.05;background:linear-gradient(90deg,var(--pink),var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-weight:700;color:var(--muted);margin-bottom:6px}
.big{font-size:40px;font-weight:900;text-align:center;color:var(--lime)}
input[type=range]{width:100%;accent-color:var(--pink);margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.bar{height:14px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));border-radius:99px;transition:width .5s}
.unit{width:100%;text-align:center;padding:10px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-weight:800;color:var(--cyan)}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;margin-top:6px;padding-bottom:20px}
.node{width:72px;height:72px;border-radius:50%;border:0;display:grid;place-items:center;font-weight:900;font-size:22px;color:#1b0b3a;position:relative;cursor:pointer;font-family:inherit;margin-bottom:6px}
.node.locked{background:#3a3450;color:#7d7597;cursor:not-allowed;box-shadow:0 7px 0 #221e30}
.node.open{background:var(--lime);box-shadow:0 7px 0 #7fbf1f;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 7px 0 #7fbf1f,0 0 22px rgba(182,255,74,.6)}}
.node.done{background:var(--cyan);box-shadow:0 7px 0 #1d9bb8}
.node.boss{width:88px;height:88px;background:var(--gold);box-shadow:0 7px 0 #b8901a}
.node .stars{position:absolute;bottom:-18px;font-size:12px;letter-spacing:1px;color:var(--gold);white-space:nowrap}
.choice{width:100%;text-align:left;padding:16px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-size:16px;margin-bottom:10px;cursor:pointer;font-weight:600;font-family:inherit;white-space:pre-line}
.choice.sel{border-color:var(--cyan);background:rgba(51,225,255,.16)}
.choice.right{border-color:var(--lime);background:rgba(182,255,74,.22)}
.choice.wrong{border-color:var(--red);background:rgba(255,93,108,.22)}
.choice:disabled{cursor:default}
.qtext{font-size:18px;line-height:1.5;margin:14px 0 8px;white-space:pre-line}
.chip{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--cyan);font-weight:700;font-size:13px}
.feedback{padding:14px;border-radius:16px;margin:6px 0 10px;font-weight:600;line-height:1.45}
.feedback.ok{background:rgba(182,255,74,.18);color:var(--lime)}
.feedback.bad{background:rgba(255,93,108,.18);color:#ffb3bb}
.hearts{color:var(--red);letter-spacing:2px}
.stars-big{font-size:36px;color:var(--gold);letter-spacing:6px;margin-top:6px}
.skill{margin:14px 0 6px;display:flex;justify-content:space-between;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(5,0,15,.65);display:grid;place-items:center;padding:20px;z-index:10}
.modal>.card{max-width:440px;width:100%;max-height:85vh;overflow:auto}
.hidden{display:none!important}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti span{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal" class="modal hidden"></div>

<script src="questions.js"></script>
<script src="app.js"></script>
<!-- Google Identity Services. initGoogle() runs once the script has loaded. -->
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>
</body>
</html>
